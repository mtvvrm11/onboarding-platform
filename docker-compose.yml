services:
  postgres:
    image: postgres:15-alpine
    container_name: vels-postgres
    environment:
      POSTGRES_DB: vels_onboarding
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5434:5432"
    volumes:
      - vels_data:/var/lib/postgresql/data

volumes:
  vels_data: