<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>admin dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="bi bi-gear-fill"></i> vels admin</a>
        <div class="ms-auto">
            <a class="btn btn-outline-light btn-sm me-2" href="/">home</a>
            <a class="btn btn-light btn-sm" href="/courses">courses</a>
        </div>
    </div>
</nav>

<div class="container my-4">
    <h1>admin dashboard</h1>

    <div class="row my-4">
        <div class="col-md-4">
            <div class="card text-center bg-primary text-white">
                <div class="card-body">
                    <h5>total courses</h5>
                    <p class="display-4" th:text="${courses.size()}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center bg-success text-white">
                <div class="card-body">
                    <h5>total users</h5>
                    <p class="display-4" th:text="${users.size()}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center bg-info text-white">
                <div class="card-body">
                    <h5>api docs</h5>
                    <a href="/swagger-ui.html" class="btn btn-light btn-sm mt-2">swagger ui</a>
                </div>
            </div>
        </div>
    </div>

    <h2>courses</h2>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>id</th>
            <th>title</th>
            <th>mandatory</th>
            <th>actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="course : ${courses}">
            <td th:text="${course.id}">1</td>
            <td th:text="${course.title}">title</td>
            <td>
                <span class="badge bg-warning" th:if="${course.mandatory}">yes</span>
                <span class="badge bg-secondary" th:unless="${course.mandatory}">no</span>
            </td>
            <td>
                <a th:href="@{/courses/{id}(id=${course.id})}" class="btn btn-sm btn-info">view</a>
                <a th:href="@{/courses/{id}/edit(id=${course.id})}" class="btn btn-sm btn-primary">edit</a>
            </td>
        </tr>
        </tbody>
    </table>

    <h2 class="mt-4">users</h2>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>id</th>
            <th>username</th>
            <th>email</th>
            <th>role</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}">1</td>
            <td th:text="${user.username}">username</td>
            <td th:text="${user.email}">email</td>
            <td th:text="${user.role.name}">role</td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
