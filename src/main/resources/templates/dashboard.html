<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="bi bi-mortarboard-fill"></i> vels onboarding</a>
        <div class="ms-auto">
            <a class="btn btn-outline-light btn-sm me-2" href="/courses">courses</a>
            <a class="btn btn-light btn-sm" href="/dashboard">dashboard</a>
        </div>
    </div>
</nav>

<div class="container my-4">
    <h1>my dashboard</h1>

    <div class="row my-4">
        <div class="col-md-3">
            <div class="card text-center bg-primary text-white">
                <div class="card-body">
                    <h5>courses</h5>
                    <p class="display-4" th:text="${courses.size()}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center bg-success text-white">
                <div class="card-body">
                    <h5>in progress</h5>
                    <p class="display-4" th:text="${progress.size()}">0</p>
                </div>
            </div>
        </div>
    </div>

    <h2>my courses</h2>
    <div class="row">
        <div class="col-md-4 mb-3" th:each="course : ${courses}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 th:text="${course.title}">course</h5>
                    <p class="text-muted" th:text="${course.description}">description</p>
                </div>
                <div class="card-footer">
                    <a th:href="@{/courses/{id}(id=${course.id})}" class="btn btn-primary btn-sm w-100">open</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
