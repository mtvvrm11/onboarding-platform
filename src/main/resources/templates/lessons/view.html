<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title th:text="${lesson.title}">lesson</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="bi bi-mortarboard-fill"></i> vels onboarding</a>
    </div>
</nav>

<div class="container my-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/">home</a></li>
            <li class="breadcrumb-item"><a href="/courses">courses</a></li>
            <li class="breadcrumb-item"><a th:href="@{/modules/{id}(id=${lesson.module.id})}" th:text="${lesson.module.title}">module</a></li>
            <li class="breadcrumb-item active" th:text="${lesson.title}">lesson</li>
        </ol>
    </nav>

    <h1 th:text="${lesson.title}">lesson title</h1>

    <!-- video block -->
    <div class="my-4">
        <!-- youtube -->
        <div th:if="${lesson.videoType == 'YOUTUBE'}" class="ratio ratio-16x9">
            <iframe th:src="${lesson.videoUrl}" allowfullscreen></iframe>
        </div>

        <!-- local video -->
        <div th:if="${lesson.videoType == 'LOCAL'}" class="ratio ratio-16x9">
            <video controls th:src="${lesson.videoUrl}"></video>
        </div>

        <!-- placeholder -->
        <div th:if="${lesson.videoUrl == null}" class="alert alert-secondary text-center">
            <i class="bi bi-camera-video-off display-4"></i>
            <p>video will be added soon</p>
        </div>
    </div>

    <!-- text content -->
    <div class="card">
        <div class="card-body">
            <h5>description</h5>
            <p th:text="${lesson.content}">lesson content</p>
        </div>
    </div>

    <div class="mt-4">
        <a th:href="@{/modules/{id}(id=${lesson.module.id})}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> back to module
        </a>
        <button class="btn btn-success">
            <i class="bi bi-check-circle"></i> mark as completed
        </button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
