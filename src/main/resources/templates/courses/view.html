<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title th:text="${course.title}">course</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="bi bi-mortarboard-fill"></i> vels onboarding</a>
        <div class="ms-auto">
            <a class="btn btn-outline-light btn-sm me-2" href="/courses">courses</a>
        </div>
    </div>
</nav>

<div class="container my-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/">home</a></li>
            <li class="breadcrumb-item"><a href="/courses">courses</a></li>
            <li class="breadcrumb-item active" th:text="${course.title}">course</li>
        </ol>
    </nav>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h1 th:text="${course.title}">course title</h1>
            <p class="text-muted" th:text="${course.description}">description</p>
            <span class="badge bg-warning" th:if="${course.mandatory}">mandatory</span>
        </div>
    </div>

    <h3>modules</h3>
    <div class="list-group">
        <div th:each="module : ${course.modules}" class="list-group-item">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="mb-1" th:text="${module.title}">module title</h5>
                    <small class="text-muted">
                        <i class="bi bi-collection-play"></i>
                        <span th:text="${module.lessons.size()}">0</span> lessons
                    </small>
                </div>
                <a th:href="@{/modules/{id}(id=${module.id})}" class="btn btn-primary btn-sm">
                    open module
                </a>
            </div>
        </div>
    </div>

    <div th:if="${course.modules.isEmpty()}" class="alert alert-info">
        no modules yet.
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
