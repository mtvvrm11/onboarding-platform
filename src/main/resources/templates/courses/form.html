<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>create course</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="bi bi-mortarboard-fill"></i> vels onboarding</a>
    </div>
</nav>

<div class="container my-4">
    <h1>create course</h1>

    <form th:action="@{/courses}" th:object="${course}" method="post" class="card p-4">
        <div class="mb-3">
            <label class="form-label">title</label>
            <input type="text" th:field="*{title}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">description</label>
            <textarea th:field="*{description}" class="form-control" rows="4"></textarea>
        </div>
        <div class="form-check mb-3">
            <input type="checkbox" th:field="*{mandatory}" class="form-check-input">
            <label class="form-check-label">mandatory</label>
        </div>
        <div class="mb-3">
            <label class="form-label">order index</label>
            <input type="number" th:field="*{orderIndex}" class="form-control">
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">
                <i class="bi bi-check-circle"></i> save
            </button>
            <a href="/courses" class="btn btn-secondary">
                <i class="bi bi-x-circle"></i> cancel
            </a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
